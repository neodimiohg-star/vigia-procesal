name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preparar la llave de firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Faltan los secrets KEYSTORE_BASE64 y KEYSTORE_PASSWORD. El APK sale con una firma temporal: para instalar una versión posterior habrá que desinstalar esta."
            echo "estable=no" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vigia-procesal.keystore"
            echo "VIGIA_KEYSTORE_PATH=$RUNNER_TEMP/vigia-procesal.keystore" >> "$GITHUB_ENV"
            echo "estable=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar el APK
        env:
          VIGIA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar el archivo
        run: cp app/build/outputs/apk/release/app-release.apk "VigiaProcesal-v${{ github.run_number }}.apk"

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: VigiaProcesal-v${{ github.run_number }}
          path: VigiaProcesal-v${{ github.run_number }}.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Vigía Procesal v${{ github.run_number }}
          body: ${{ steps.firma.outputs.estable == 'si' && 'APK listo para instalar en Android 8.0 o superior. Descárgalo desde el teléfono y ábrelo. Si ya tenías una versión anterior, se actualiza sin perder tus procesos.' || 'APK con FIRMA TEMPORAL (faltan los secrets de firma del repositorio). Funciona, pero para instalar una versión posterior habrá que desinstalar esta primero.' }}
          files: VigiaProcesal-v${{ github.run_number }}.apk
          make_latest: true
